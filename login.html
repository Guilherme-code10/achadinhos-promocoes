<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar | Achadinhos & Promoções</title>
  <style>
    :root{--teal:#075f61;--teal2:#0b7777;--gold:#c9a85d;--ink:#173235;--muted:#6d7c7e;--bg:#f4f7f6;--white:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#fff 0,#eef4f2 55%,#e7eeec 100%);font-family:Inter,Arial,sans-serif;color:var(--ink)}
    .card{width:min(430px,92vw);background:#fff;border:1px solid #e4e9e7;border-radius:28px;padding:34px;box-shadow:0 24px 70px rgba(10,47,49,.12);text-align:center}.logo{width:145px;height:145px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.08)}h1{font-family:Georgia,serif;font-weight:500;margin:18px 0 5px;color:var(--teal);font-size:30px}.sub{color:var(--muted);margin:0 0 25px}.field{text-align:left;margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:14px 15px;border:1px solid #d8e0de;border-radius:13px;font-size:16px;outline:none}.field input:focus{border-color:var(--teal)}button{width:100%;border:0;border-radius:13px;padding:15px;background:var(--teal);color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}.error{min-height:20px;color:#b42318;font-size:13px;margin-top:12px}.small{font-size:12px;color:#8a9697;margin-top:20px}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/logo.png" alt="Achadinhos & Promoções" />
    <h1>Achadinhos & Promoções</h1>
    <p class="sub">Central de Ofertas</p>
    <form id="loginForm">
      <div class="field"><label for="password">Senha de acesso</label><input id="password" type="password" autocomplete="current-password" required placeholder="Digite sua senha" /></div>
      <button type="submit">Entrar</button>
      <div id="error" class="error"></div>
    </form>
    <div class="small">Área privada da Central de Ofertas</div>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e)=>{
      e.preventDefault(); const error=document.getElementById('error'); error.textContent='';
      const password=document.getElementById('password').value;
      try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password})}); const d=await r.json(); if(!r.ok) throw new Error(d.error||'Senha inválida'); location.href='/';}
      catch(err){error.textContent=err.message;}
    });
  </script>
</body>
</html>
