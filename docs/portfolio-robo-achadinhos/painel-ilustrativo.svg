<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
<title id="title">Achadinhos e Promoções — Dashboard de automação</title>
<desc id="description">Ilustração pública do painel, com cartões representando busca, validação, agendamento e integração ao WhatsApp. Não são dados da produção.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#083e37"/><stop offset="1" stop-color="#16816b"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f7fbf8"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="#f4f8f5"/>
