<text x="72" y="53" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#e7fff0">ACHADINHOS &amp; PROMOÇÕES</text>
<text x="72" y="118" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="white">Automação de ofertas</text>
