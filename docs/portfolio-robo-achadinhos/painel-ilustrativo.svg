 <rect x="326" y="306" width="246" height="6" rx="3" fill="#32b689"/>
 <text x="348" y="350" font-size="19" font-weight="700" fill="#245f53">Verificação</text>
 <text x="348" y="389" font-size="16" fill="#476e64">Preço e origem</text>
 <text x="348" y="421" font-size="15" fill="#397565">● Antes da publicação</text>
 <rect x="588" y="306" width="246" height="149" rx="17" fill="url(#card)" stroke="#d1e9da"/>
