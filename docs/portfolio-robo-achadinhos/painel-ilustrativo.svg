<text x="450" y="247" font-family="Arial, sans-serif" font-size="18" fill="#356c60">Verificação</text>
<text x="665" y="247" font-family="Arial, sans-serif" font-size="18" fill="#356c60">Fila</text>
<text x="796" y="247" font-family="Arial, sans-serif" font-size="18" fill="#356c60">WhatsApp</text>
